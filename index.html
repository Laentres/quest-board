<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Quest Board</title>
        <link rel="stylesheet" href="css/base.css">
        <link rel="stylesheet" href="css/layout.css">
        <link rel="stylesheet" href="css/components.css">
    </head>
    <body>
        <header>
            <h1>Quest Board</h1>
        </header>
        
        <main>
            <section id="board">
                <article class="quest-card" data-id="1" data-due="2026-11-09">
                    <p class="quest-category">Start the day</p>
                    <h2 class="quest-title">Get out of bed</h2>
                    <p class="quest-subquest">Take less than 30 minutes to get up after waking up</p>
                    <p class="quest-xp">5 XP</p>
                    <p class="quest-by">Submitted by Elle</p>
                    <p class="quest-due">Due: <time datetime="2026-11-09">9th November 2026</time></p>
                    <p class="quest-status">Completed</p>
                </article>
            </section>
        </main>

        <footer>
        </footer>
    </body>
</html>
